
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수시 통합관리 - Google 로그인</title>

<script
  src="https://accounts.google.com/gsi/client"
  async defer>
</script>

<style>
body{
  background:#f4f6fc;
  color:#1f2937;
  font-family:system-ui,'Malgun Gothic',sans-serif;
  margin:0
}
header{
  background:#4f46e5;
  color:white;
  padding:15px 22px;
  font-weight:bold
}
main{
  max-width:1100px;
  margin:30px auto;
  padding:0 16px
}
.card{
  background:white;
  border:1px solid #e2e8f0;
  padding:24px;
  border-radius:14px;
  box-shadow:0 3px 10px #0001
}
h1{font-size:23px}
p{color:#64748b}
.status{
  background:#eef2ff;
  padding:13px;
  border-radius:8px;
  margin:16px 0
}
#app{
  display:none;
  width:100%;
  height:78vh;
  min-height:650px;
  border:1px solid #cbd5e1;
  border-radius:12px;
  background:white
}
#loginPanel{
  max-width:560px;
  margin:60px auto
}
</style>
</head>

<body>
<header>🎓 2026 수시 통합관리 시스템</header>

<main>
  <div id="loginPanel" class="card">
    <h1>교직원 Google 로그인</h1>

    <p>
      허가된 교직원 Gmail 계정으로 로그인해 주세요.
    </p>

    <div id="googleBtn"></div>

    <div id="status" class="status" role="status">
      Google 로그인 버튼을 준비하는 중입니다…
    </div>

    <p>
      허가된 사용자만 데이터를 조회할 수 있습니다.
    </p>
  </div>

  <iframe
    id="app"
    title="수시 통합관리 대시보드"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
</main>

<script>
// 아래 두 값 수정
const CLIENT_ID =
  '287828594474-uhn5iorsu5fuepof0nhsjld6ejnhmrcj.apps.googleusercontent.com';

const GAS_EXEC_URL =
  'https://script.google.com/macros/s/AKfycbzXgpSI-Do7YHrqpkD2qg_gV-zdWQLeviXaWgDr4x6-oyaPWXiZhQTBuNy41BeqW2BT/exec';

let idToken = '';
let handshake = '';

const loginPanel =
  document.getElementById('loginPanel');

const iframe =
  document.getElementById('app');

const status =
  document.getElementById('status');

function setStatus(s) {
  status.textContent=s;
}

function initGoogle() {
  if (!window.google?.accounts?.id) {
    setStatus('Google 로그인 라이브러리를 불러오지 못했습니다.');
    return;
  }

  if (CLIENT_ID.includes('YOUR_')) {
    setStatus('CLIENT_ID를 입력해 주세요.');
    return;
  }

  google.accounts.id.initialize({
    client_id:CLIENT_ID,
    callback:signIn,
    ux_mode:'popup',
    auto_select:false
  });

  google.accounts.id.renderButton(
    document.getElementById('googleBtn'),
    {
      theme:'outline',
      size:'large',
      text:'signin_with',
      width:310
    }
  );

  setStatus(
    '교사권한 시트에 등록된 Gmail로 로그인하세요.'
  );
}

function signIn(result) {
  if (!result?.credential) {
    setStatus('로그인 토큰을 받지 못했습니다.');
    return;
  }

  idToken=result.credential;

  handshake=Array.from(
    crypto.getRandomValues(new Uint8Array(24)),
    b=>b.toString(16).padStart(2,'0')
  ).join('');

  setStatus('수시 관리 화면을 연결하는 중입니다…');

  iframe.src=
    GAS_EXEC_URL +
    '?nonce=' +
    encodeURIComponent(handshake);
}

window.addEventListener('message',event=>{
  const d=event.data;

  if (
    !d ||
    d.type!=='SUSI_READY' ||
    d.nonce!==handshake ||
    !idToken
  ) return;

  const isGoogleFrame=
    event.origin==='null' ||
    /^https:\/\/(?:script\.google\.com|[a-z0-9.-]*googleusercontent\.com)$/
      .test(event.origin);

  if (!isGoogleFrame) return;

  event.source.postMessage(
    {
      type:'SUSI_AUTH',
      nonce:handshake,
      token:idToken
    },
    event.origin==='null'?'*':event.origin
  );

  loginPanel.style.display='none';
  iframe.style.display='block';
});

window.addEventListener('load',initGoogle);
</script>
</body>
</html>
